name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Frontend build
        run: bun install --frozen-lockfile && bun run build

      - name: Rust test + check
        working-directory: src-tauri
        run: cargo test && cargo check

  # Reproduksi engine macOS di setiap push: build gb_cpp + stage-bundle +
  # engine-smoke (termasuk model-load smoke). v1.4 segfault di macOS
  # (session creation) lolos karena smoke lama hanya `--help` dan CI tidak
  # pernah jalan di macOS. Job ini menutup celah itu.
  engine-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout engine source (Good-Badminton-Cpp)
        run: git clone --depth 1 https://github.com/wafik/good-badminton-cpp.git cpp-engine-src

      - name: Engine deps (brew OpenCV 4 + dylibbundler + ONNX Runtime)
        run: |
          brew uninstall --force opencv 2>/dev/null || true
          brew install opencv@4 dylibbundler
          curl -fsSL -o /tmp/ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.19.2/onnxruntime-osx-arm64-1.19.2.tgz
          mkdir -p cpp-engine-src/third_party
          tar -xzf /tmp/ort.tgz -C cpp-engine-src/third_party

      - name: Build engine
        run: |
          cmake -S cpp-engine-src -B cpp-engine-src/build -DCMAKE_BUILD_TYPE=Release \
            -DOpenCV_DIR="$(brew --prefix opencv@4)/lib/cmake/opencv4"
          cmake --build cpp-engine-src/build -j

      - name: Stage engine + models into bundle
        run: bash scripts/stage-bundle.sh cpp-engine-src

      - name: Smoke — bundled engine loads models
        run: bash scripts/engine-smoke.sh

      # Gagal di smoke = segfault/abort pas load model. Ambil backtrace + crash
      # report supaya root-cause ketahuan tanpa nebak-nebak staging/codesign.
      - name: Crash diagnostics (backtrace + report)
        if: failure()
        run: |
          set +e
          M=src-tauri/bundle/models; E=src-tauri/bundle/engine
          T=$(mktemp -d); : > "$T/dummy.mp4"
          echo "== otool -L gb_cpp =="; otool -L "$E/gb_cpp"
          echo "== otool -l LC_RPATH gb_cpp =="; otool -l "$E/gb_cpp" | grep -A2 LC_RPATH
          echo "== codesign -dvvv =="; codesign -dvvv "$E/gb_cpp" 2>&1 | head -25
          echo "== lldb backtrace =="
          GB_FORCE_CPU=1 lldb --batch \
            -o "run $T/dummy.mp4 --ball-model $M/yolo11s-ball.onnx --yolo-pose-model $M/yolo11n-pose-dyn.onnx --out $T/out" \
            -o "bt all" -o "quit" "$E/gb_cpp" 2>&1 | tail -120
          echo "== crash report =="
          sleep 5
          f=$(find "$HOME/Library/Logs/DiagnosticReports" -name 'gb_cpp*.ips' -mmin -10 2>/dev/null | head -1)
          if [ -n "$f" ]; then echo "report: $f"; head -c 6000 "$f"; else echo "no .ips yet"; fi
