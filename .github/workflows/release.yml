name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libopencv-dev

      - name: Checkout engine source (Good-Badminton-Cpp)
        run: git clone --depth 1 https://github.com/wafik/good-badminton-cpp.git cpp-engine-src

      - name: Engine deps (Windows: OpenCV prebuilt + ONNX Runtime)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cpp-engine-src/third_party | Out-Null
          curl.exe -fsSL -o $env:TEMP/opencv.exe https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe
          7z x -y $env:TEMP/opencv.exe -o"$PWD/cpp-engine-src/third_party" | Out-Null
          curl.exe -fsSL -o $env:TEMP/ort.zip https://github.com/microsoft/onnxruntime/releases/download/v1.19.2/onnxruntime-win-x64-1.19.2.zip
          7z x -y $env:TEMP/ort.zip -o"$PWD/cpp-engine-src/third_party" | Out-Null
          # ONNX Runtime DirectML: build dengan export provider GPU (auto-detect NVIDIA/AMD/Intel)
          curl.exe -fsSL -o $env:TEMP/ort-dml.nupkg https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime.DirectML/1.19.2
          7z e -y -o"$PWD/cpp-engine-src/third_party/onnxruntime-directml-1.19.2" $env:TEMP/ort-dml.nupkg "runtimes/win-x64/native/onnxruntime.dll" | Out-Null

      - name: Engine deps (macOS: brew OpenCV + ONNX Runtime)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install opencv dylibbundler
          curl -fsSL -o /tmp/ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.19.2/onnxruntime-osx-arm64-1.19.2.tgz
          mkdir -p cpp-engine-src/third_party
          tar -xzf /tmp/ort.tgz -C cpp-engine-src/third_party

      - name: Engine deps (Linux: ONNX Runtime — OpenCV dari apt di atas)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          curl -fsSL -o /tmp/ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.19.2/onnxruntime-linux-x64-1.19.2.tgz
          mkdir -p cpp-engine-src/third_party
          tar -xzf /tmp/ort.tgz -C cpp-engine-src/third_party

      - name: Build engine
        shell: bash
        run: |
          extra=()
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            extra+=(-DOpenCV_DIR="$(brew --prefix opencv)/lib/cmake/opencv4")
          fi
          cmake -S cpp-engine-src -B cpp-engine-src/build -DCMAKE_BUILD_TYPE=Release ${extra[@]+"${extra[@]}"}
          cmake --build cpp-engine-src/build --config Release -j

      - name: Stage engine + models into bundle
        shell: bash
        run: bash scripts/stage-bundle.sh cpp-engine-src

      - name: Smoke — bundled engine runs
        shell: bash
        run: bash scripts/engine-smoke.sh

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Good-Badminton Studio ${{ github.ref_name }}
          releaseBody: >
            Desktop GUI for the Good-Badminton analysis pipeline — one
            installer, everything included: the C++ engine (gb_cpp + runtime
            libraries) and the YOLO ONNX models are bundled. Install and run,
            no extra setup. GPU acceleration on Windows (DirectML,
            auto-detected, automatic CPU fallback). Installers: Windows
            (NSIS), macOS (Apple Silicon), Linux (deb/AppImage). ffmpeg
            optional (audio export).
          args: ${{ matrix.args }}
